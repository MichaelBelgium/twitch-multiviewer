<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch multiple Twitch streams simultaneously. Perfect for tournaments, co-streams, or keeping up with your favorite streamers.">
    <title>Twitch Multistream</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-twitch-purple: #9147ff;
            --color-twitch-dark: #0e0e10;
            --color-twitch-gray: #18181b;
            --color-twitch-border: #464649;
        }

        @layer base {
            button:not(:disabled), [role="button"]:not(:disabled) {
                cursor: pointer;
            }
        }

        #chatSidebar, #streamContainer {
            height: calc(100vh - var(--header-height));
        }

        #chatSidebar {
            top: var(--header-height);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-twitch-dark text-gray-900 dark:text-gray-100 h-screen">
    <header class="bg-white dark:bg-twitch-gray border-b-2 border-twitch-purple p-4">
        <h1 class="text-twitch-purple text-2xl font-bold mb-4">Twitch multi-viewer</h1>
        
        <div class="flex flex-col xl:flex-row gap-2 xl:items-center xl:justify-between">
            <section>
                <input
                    type="text"
                    id="channel"
                    autocomplete="off"
                    placeholder="Enter Twitch username..."
                    class="bg-white dark:bg-twitch-dark border-2 border-gray-300 dark:border-twitch-border text-gray-900 dark:text-gray-100 px-4 py-2 rounded-sm focus:outline-hidden focus:border-twitch-purple flex-1 min-w-[200px] max-w-xs"
                />
                <button
                    onclick="addChannel()"
                    class="bg-twitch-purple hover:bg-purple-700 text-white px-6 py-2 rounded-sm font-semibold transition active:scale-95"
                >
                    Add Stream
                </button>
                <button
                    onclick="clearAll()"
                    class="bg-twitch-purple hover:bg-purple-700 text-white px-6 py-2 rounded-sm font-semibold transition active:scale-95"
                >
                    Clear All
                </button>
                <button
                    onclick="toggleChat()"
                    id="chatToggle"
                    class="bg-twitch-purple hover:bg-purple-700 text-white px-6 py-2 rounded-sm font-semibold transition active:scale-95"
                >
                    Show Chat
                </button>
            </section>
            <section>
                <div class="mb-2">
                    <button
                        id="saveListBtn"
                        onclick="openSaveModal()"
                        class="hidden bg-twitch-purple hover:bg-purple-700 text-white px-6 py-2 rounded-sm font-semibold transition active:scale-95"
                    >Save List</button>
                </div>
            </section>
        </div>

        <div class="flex flex-wrap gap-2 mt-3" id="tagContainer"></div>
    </header>

    <div id="saveListModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden">
        <div class="bg-white dark:bg-twitch-gray border-2 border-twitch-purple rounded-sm shadow-xl p-6 w-full max-w-sm mx-4 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-twitch-purple">Save current list</h2>
            <input
                type="text"
                id="listNameInput"
                autocomplete="off"
                placeholder="Name (optional)"
                class="bg-white dark:bg-twitch-dark border-2 border-gray-300 dark:border-twitch-border text-gray-900 dark:text-gray-100 px-4 py-2 rounded-sm focus:outline-hidden focus:border-twitch-purple"
                onkeydown="if(event.key==='Enter') saveList()"
            />
            <div class="flex gap-2 justify-end">
                <button
                    onclick="closeSaveModal()"
                    class="bg-gray-200 hover:bg-gray-300 dark:bg-twitch-border dark:hover:bg-gray-500 text-gray-800 dark:text-gray-100 px-5 py-2 rounded-sm font-semibold transition active:scale-95"
                >Cancel</button>
                <button
                    onclick="saveList()"
                    class="bg-twitch-purple hover:bg-purple-700 text-white px-5 py-2 rounded-sm font-semibold transition active:scale-95"
                >Save</button>
            </div>
        </div>
    </div>

    <div id="streamContainer" class="grid grid-cols-1 gap-1"></div>

    <div id="chatSidebar" class="fixed right-0 w-80 bg-white dark:bg-twitch-gray border-l-2 border-twitch-purple overflow-y-auto translate-x-full duration-300 ease-in-out z-50 shadow-lg dark:shadow-none">
    </div>

    <script src="script.js"></script>
</body>
</html>
